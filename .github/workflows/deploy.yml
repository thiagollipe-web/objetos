name: Bit RC1 - Teste e Publicação

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bit-pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verificar Node e npm
        run: |
          node --version
          npm --version

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Verificar estrutura da Bit
        run: node scripts/verify-bit.mjs

      - name: Executar testes
        run: npm test

      - name: Gerar build de produção
        run: npm run build

      - name: Verificar tamanho do build
        shell: bash
        run: |
          SIZE=$(du -sk dist | cut -f1)
          echo "Tamanho do dist: ${SIZE} KB"
          if [ "${SIZE}" -gt 300 ]; then
            echo "Erro: build excede 300 KB."
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: quality
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: https://thiagollipe-web.github.io/objetos/

    steps:
      - name: Publicar Bit
        uses: actions/deploy-pages@v4
